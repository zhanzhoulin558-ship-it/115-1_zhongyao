<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115-1 藥學導論 50種中藥材隨機測驗 & 大圖對照</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #181b21;
    --surface-hover: #22262f;
    --border: #2a2f3a;
    --text: #f1f3f5;
    --text-muted: #9aa0a6;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --accent: #f43f5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 40px;
  }
  .container { max-width: 1120px; margin: 0 auto; padding: 16px; }
  
  /* Top Nav Bar */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface-hover); }
  .tab-btn.active {
    background: #252a34;
    color: #fff;
    border-color: #3f4756;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .order-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .shuffle-btn {
    background: #172554;
    color: #93c5fd;
    border: 1px solid #1e3a8a;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .shuffle-btn:hover { background: #1e3a8a; color: #fff; }
  .sort-btn {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .sort-btn:hover { background: #334155; color: #fff; }

  /* Filter & Stats Bar */
  .sub-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 13px;
  }
  .filter-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.15s;
  }
  .chip:hover { border-color: #4b5563; color: var(--text); }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .stats { color: var(--text-muted); display: flex; gap: 14px; align-items: center; }
  .stats span b { color: var(--text); }

  /* Quiz Card */
  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .badge {
    background: #262b36;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: #cbd5e1;
  }
  .badge.trap { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
  .img-box {
    width: 100%;
    height: 300px;
    background: #0a0c0f;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    position: relative;
    cursor: zoom-in;
  }
  .img-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .img-fallback {
    padding: 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  .q-prompt {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .hint-text {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 14px;
  }

  /* Fill-in Inputs */
  .fill-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .input-row { display: flex; flex-direction: column; gap: 5px; }
  .input-row label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .input-row input {
    background: #101318;
    border: 1px solid #374151;
    color: #fff;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-row input:focus { border-color: var(--primary); }
  .input-row input.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
  .input-row input.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }

  /* Multiple Choice */
  .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
  .opt-btn {
    background: #13161c;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 10px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
    transition: 0.15s;
  }
  .opt-btn:hover:not(:disabled) { background: var(--surface-hover); border-color: #4b5563; }
  .opt-btn.correct { background: rgba(16, 185, 129, 0.18); border-color: var(--success); color: #6ee7b7; }
  .opt-btn.wrong { background: rgba(239, 68, 68, 0.18); border-color: var(--danger); color: #fca5a5; }

  /* Feedback & Actions */
  .feedback {
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 14px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); color: #a7f3d0; }
  .feedback.err { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #fecaca; }
  .feedback .ans-highlight { font-size: 16px; font-weight: 700; color: #fff; margin: 4px 0; }
  .feedback .full-desc { font-size: 13px; color: #cbd5e1; }
  .feedback .tip { margin-top: 6px; font-size: 13px; color: #fbbf24; }

  .action-row { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary {
    background: #262b36;
    color: #e2e8f0;
    border: 1px solid #3f4756;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }

  /* Flashcard */
  .fc-back {
    display: none;
    text-align: center;
    padding: 16px;
    background: #12151b;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .fc-back.flipped { display: block; }
  .fc-name { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .fc-core { font-size: 22px; font-weight: 800; color: #fb7185; margin-bottom: 6px; }
  .fc-full { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }

  /* Reference Grid (Big Images) */
  .ref-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 14px;
  }
  .ref-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .ref-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .ref-img-wrap {
    width: 100%;
    height: 270px;
    background: #0a0c0f;
    cursor: zoom-in;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ref-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .ref-grid.contain-mode .ref-img-wrap img { object-fit: contain; }
  .ref-body { padding: 14px; cursor: pointer; flex: 1; }
  .ref-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .ref-core { font-size: 16px; font-weight: 800; color: #fb7185; margin-bottom: 4px; }
  .ref-full { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .ref-note { font-size: 12px; color: #94a3b8; }
  .mask-mode .ref-body .maskable { filter: blur(6px); transition: filter 0.15s; }
  .ref-card.unmasked .ref-body .maskable { filter: none; }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 92vh; border-radius: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="mode-tabs">
      <button class="tab-btn active" data-mode="fill">✍️ 填充題（看圖填名字＋粗體部位）</button>
      <button class="tab-btn" data-mode="mc-both">🎯 選擇題（看圖選名稱＋部位）</button>
      <button class="tab-btn" data-mode="mc-part">🧬 選擇題（給藥名選粗體部位）</button>
      <button class="tab-btn" data-mode="flash">🃏 閃卡速刷</button>
      <button class="tab-btn" data-mode="ref">📖 50種藥材大圖對照表</button>
    </div>
    <div class="order-controls">
      <button class="sort-btn" id="sortBtn">🔢 依編號順序 (1→50)</button>
      <button class="shuffle-btn" id="shuffleBtn">🔀 重新隨機洗牌</button>
    </div>
  </div>

  <!-- Sub Bar -->
  <div class="sub-bar">
    <div class="filter-group" id="filterGroup">
      <button class="chip active" data-filter="all">全部 (50)</button>
      <button class="chip" data-filter="trap">🔥 易混淆陷阱</button>
      <button class="chip" data-filter="root">🌱 根與根莖類</button>
      <button class="chip" data-filter="seed">🌰 種子果實類</button>
      <button class="chip" data-filter="special">✨ 特殊部位</button>
      <button class="chip" data-filter="wrong">📌 錯題本 (<span id="wrongCount">0</span>)</button>
    </div>
    <div class="stats" id="statsBar">
      <span>進度：<b id="statProg">1/50</b></span>
      <span>答對：<b id="statRight" style="color:var(--success)">0</b></span>
      <span>答錯：<b id="statWrong" style="color:var(--danger)">0</b></span>
    </div>
  </div>

  <!-- Quiz View -->
  <div id="quizView" class="quiz-card">
    <div class="q-header">
      <span id="qIndex">第 1 題 / 共 50 題</span>
      <span id="qBadge" class="badge">分類</span>
    </div>
    <div class="img-box" id="qImgBox" title="點擊放大檢視"></div>
    <div class="q-prompt" id="qPrompt"></div>
    <div class="hint-text" id="qHint"></div>

    <!-- Fill Mode -->
    <div id="fillArea" class="fill-group">
      <div class="input-row">
        <label for="inName">1. 藥材名稱（支援別名，如 烏頭/川烏）：</label>
        <input type="text" id="inName" placeholder="輸入藥材名稱..." autocomplete="off">
      </div>
      <div class="input-row">
        <label for="inPart">2. 藥用部位（附件三粗體字，如 根、根莖、種子）：</label>
        <input type="text" id="inPart" placeholder="輸入粗體藥用部位..." autocomplete="off">
      </div>
    </div>

    <!-- Multiple Choice Mode -->
    <div id="mcArea" class="options-grid hidden"></div>

    <!-- Flashcard Mode -->
    <div id="flashArea" class="fc-back">
      <div class="fc-name" id="fcName"></div>
      <div class="fc-core" id="fcCore"></div>
      <div class="fc-full" id="fcFull"></div>
      <div class="tip" id="fcTip" style="color:#fbbf24;font-size:13px;"></div>
    </div>

    <div class="feedback" id="feedbackBox"></div>

    <div class="action-row">
      <button class="btn-secondary hidden" id="flipBtn">顯示/隱藏答案 (Space)</button>
      <button class="btn-primary" id="submitBtn">送出批改 (Enter)</button>
      <button class="btn-primary hidden" id="nextBtn">下一題 (Enter) ➔</button>
    </div>
  </div>

  <!-- Reference Big Image View -->
  <div id="refView" class="hidden">
    <div class="ref-controls">
      <input type="text" class="search-input" id="refSearch" placeholder="🔍 搜尋編號、藥材名稱、粗體部位（如：根莖、種子、塊莖）...">
      <button class="btn-secondary" id="toggleMaskBtn">🙈 遮罩背誦模式</button>
      <button class="btn-secondary" id="toggleFitBtn">🖼️ 切換滿版 / 完整比例</button>
    </div>
    <div class="ref-grid" id="refGrid"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

const ALL_CORES = [...new Set(HERBS.map(h => h.core))];

let state = {
  mode: "fill",
  filter: "all",
  isShuffled: true,
  deck: [],
  idx: 0,
  right: 0,
  wrong: 0,
  answered: false,
  wrongIds: new Set(JSON.parse(localStorage.getItem("tcm50_wrong") || "[]"))
};

function saveWrong() {
  localStorage.setItem("tcm50_wrong", JSON.stringify([...state.wrongIds]));
  document.getElementById("wrongCount").textContent = state.wrongIds.size;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFilteredHerbs() {
  return HERBS.filter(h => {
    if (state.filter === "trap") return h.trap;
    if (state.filter === "root") return h.cat === "root";
    if (state.filter === "seed") return h.cat === "seed";
    if (state.filter === "special") return h.cat === "special";
    if (state.filter === "wrong") return state.wrongIds.has(h.id);
    return true;
  });
}

function rebuildDeck(shouldShuffle = state.isShuffled) {
  state.isShuffled = shouldShuffle;
  const list = getFilteredHerbs();
  const base = list.length ? list : HERBS;
  state.deck = shouldShuffle ? shuffle(base) : [...base].sort((a, b) => a.id - b.id);
  state.idx = 0;
  state.right = 0;
  state.wrong = 0;
  state.answered = false;
  updateStats();
  if (state.mode === "ref") renderRefGrid();
  else renderQuestion();
}

function updateStats() {
  const total = state.deck.length || 1;
  document.getElementById("statProg").textContent = `${Math.min(state.idx + 1, total)}/${total}`;
  document.getElementById("statRight").textContent = state.right;
  document.getElementById("statWrong").textContent = state.wrong;
  document.getElementById("wrongCount").textContent = state.wrongIds.size;
}

function createImgElement(herb) {
  const img = document.createElement("img");
  img.alt = herb.name;
  const candidates = [
    herb.file,
    herb.file.replace(".JPG", ".jpg"),
    `115-1藥學導論 50種中藥材照片/${herb.file}`,
    `115-1藥學導論 50種中藥材照片/${herb.file.replace(".JPG", ".jpg")}`
  ];
  let tryIdx = 0;
  img.src = candidates[0];
  img.onerror = () => {
    tryIdx++;
    if (tryIdx < candidates.length) {
      img.src = candidates[tryIdx];
    } else {
      const parent = img.parentElement;
      if (parent) {
        parent.innerHTML = `<div class="img-fallback">🖼️ 找不到圖片 <b>${herb.file}</b><br><small>請確認本 HTML 檔與 50 張圖片放在同一資料夾</small></div>`;
      }
    }
  };
  img.onclick = (e) => {
    e.stopPropagation();
    openLightbox(img.src);
  };
  return img;
}

function openLightbox(src) {
  if (!src) return;
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("open");
}
document.getElementById("lightbox").onclick = () => {
  document.getElementById("lightbox").classList.remove("open");
};

function renderQuestion() {
  const total = state.deck.length;
  if (state.idx >= total) {
    document.getElementById("qIndex").textContent = "測驗完成！";
    document.getElementById("qImgBox").innerHTML = `<div class="img-fallback" style="font-size:18px;color:#fff;">🎉 本輪 ${total} 題已全數完成！<br><br>答對 ${state.right} 題 / 答錯 ${state.wrong} 題</div>`;
    document.getElementById("qPrompt").textContent = "";
    document.getElementById("qHint").textContent = "";
    document.getElementById("fillArea").classList.add("hidden");
    document.getElementById("mcArea").classList.add("hidden");
    document.getElementById("flashArea").classList.remove("flipped");
    document.getElementById("feedbackBox").classList.remove("show");
    document.getElementById("submitBtn").classList.add("hidden");
    document.getElementById("flipBtn").classList.add("hidden");
    document.getElementById("nextBtn").textContent = "🔄 再刷一輪";
    document.getElementById("nextBtn").classList.remove("hidden");
    return;
  }

  const h = state.deck[state.idx];
  state.answered = false;
  updateStats();

  document.getElementById("qIndex").textContent = `第 ${state.idx + 1} 題 / 共 ${total} 題`;
  const badge = document.getElementById("qBadge");
  badge.textContent = h.trap ? "🔥 易混淆陷阱" : (h.cat === "root" ? "根與根莖類" : h.cat === "seed" ? "種子果實類" : "特殊部位");
  badge.className = h.trap ? "badge trap" : "badge";

  const imgBox = document.getElementById("qImgBox");
  imgBox.innerHTML = "";
  const fb = document.getElementById("feedbackBox");
  fb.className = "feedback";
  fb.innerHTML = "";

  const fillArea = document.getElementById("fillArea");
  const mcArea = document.getElementById("mcArea");
  const flashArea = document.getElementById("flashArea");
  const submitBtn = document.getElementById("submitBtn");
  const nextBtn = document.getElementById("nextBtn");
  const flipBtn = document.getElementById("flipBtn");

  fillArea.classList.add("hidden");
  mcArea.classList.add("hidden");
  flashArea.classList.remove("flipped");
  submitBtn.classList.add("hidden");
  nextBtn.classList.add("hidden");
  nextBtn.textContent = "下一題 (Enter) ➔";
  flipBtn.classList.add("hidden");

  if (state.mode === "fill") {
    imgBox.classList.remove("hidden");
    imgBox.appendChild(createImgElement(h));
    document.getElementById("qPrompt").textContent = "請看圖寫出「藥材名稱」與「粗體藥用部位」";
    document.getElementById("qHint").textContent = `提示：藥名 ${h.name.length} 字 ｜ 粗體部位 ${h.core.length} 字`;
    fillArea.classList.remove("hidden");
    const inName = document.getElementById("inName");
    const inPart = document.getElementById("inPart");
    inName.value = "";
    inPart.value = "";
    inName.className = "";
    inPart.className = "";
    inName.disabled = false;
    inPart.disabled = false;
    submitBtn.classList.remove("hidden");
    setTimeout(() => inName.focus(), 30);
  } else if (state.mode === "mc-both") {
    imgBox.classList.remove("hidden");
    imgBox.appendChild(createImgElement(h));
    document.getElementById("qPrompt").textContent = "請選出正確的「藥材名稱 ＋ 粗體藥用部位」";
    document.getElementById("qHint").textContent = "";
    mcArea.classList.remove("hidden");
    renderMcBothOptions(h);
  } else if (state.mode === "mc-part") {
    imgBox.classList.remove("hidden");
    imgBox.appendChild(createImgElement(h));
    document.getElementById("qPrompt").innerHTML = `【${h.name}】的粗體藥用部位為何？`;
    document.getElementById("qHint").textContent = "";
    mcArea.classList.remove("hidden");
    renderMcPartOptions(h);
  } else if (state.mode === "flash") {
    imgBox.classList.remove("hidden");
    imgBox.appendChild(createImgElement(h));
    document.getElementById("qPrompt").textContent = "先在心中默背藥名與粗體部位，點擊下方翻開答案";
    document.getElementById("qHint").textContent = "";
    document.getElementById("fcName").textContent = `${h.id}. ${h.name}` + (h.aliases.length ? `（${h.aliases.join(" / ")}）` : "");
    document.getElementById("fcCore").textContent = `粗體部位：${h.core}`;
    document.getElementById("fcFull").textContent = `完整描述：${h.full}`;
    document.getElementById("fcTip").textContent = `💡 ${h.tip}`;
    flipBtn.classList.remove("hidden");
    nextBtn.classList.remove("hidden");
  }
}

function normalizeStr(s) {
  return s.trim()
    .replace(/\s+/g, "")
    .replace(/（/g, "(").replace(/）/g, ")")
    .replace(/術/g, "朮")
    .replace(/曲/g, "麴")
    .replace(/瓜蔞/g, "栝樓")
    .replace(/芯/g, "心");
}

function checkFillAnswer() {
  if (state.answered) return;
  const h = state.deck[state.idx];
  const inName = document.getElementById("inName");
  const inPart = document.getElementById("inPart");
  const uName = normalizeStr(inName.value);
  const uPart = normalizeStr(inPart.value);

  const validNames = [h.name, ...h.aliases].map(normalizeStr);
  const nameOk = validNames.includes(uName);
  const partOk = uPart === normalizeStr(h.core);

  inName.className = nameOk ? "correct" : "wrong";
  inPart.className = partOk ? "correct" : "wrong";
  inName.disabled = true;
  inPart.disabled = true;

  const isAllOk = nameOk && partOk;
  recordResult(h, isAllOk);

  const fb = document.getElementById("feedbackBox");
  fb.className = `feedback show ${isAllOk ? "ok" : "err"}`;
  fb.innerHTML = `
    <div>${isAllOk ? "✅ 完全正確！" : "❌ 答錯了，請核對正確答案："}</div>
    <div class="ans-highlight">${h.id}. ${h.name}${h.aliases.length ? `（${h.aliases[0]}）` : ""} ｜ 粗體部位：<u>${h.core}</u></div>
    <div class="full-desc">附件三完整描述：${h.full}</div>
    <div class="tip">💡 ${h.tip}</div>
  `;

  document.getElementById("submitBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("nextBtn").focus();
}

function renderMcBothOptions(h) {
  const mcArea = document.getElementById("mcArea");
  mcArea.innerHTML = "";
  const distractors = shuffle(HERBS.filter(x => x.id !== h.id)).slice(0, 3);
  const choices = shuffle([h, ...distractors]);

  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = `<b>${c.name}</b> — <span style="color:#fb7185;font-weight:700">${c.core}</span>`;
    btn.onclick = () => {
      if (state.answered) return;
      const ok = c.id === h.id;
      [...mcArea.children].forEach((b, i) => {
        b.disabled = true;
        if (choices[i].id === h.id) b.classList.add("correct");
        else if (choices[i].id === c.id) b.classList.add("wrong");
      });
      recordResult(h, ok);
      showMcFeedback(h, ok);
    };
    mcArea.appendChild(btn);
  });
}

function renderMcPartOptions(h) {
  const mcArea = document.getElementById("mcArea");
  mcArea.innerHTML = "";
  const others = shuffle(ALL_CORES.filter(p => p !== h.core)).slice(0, 3);
  const choices = shuffle([h.core, ...others]);

  choices.forEach(part => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.innerHTML = `<b>${part}</b>`;
    btn.onclick = () => {
      if (state.answered) return;
      const ok = part === h.core;
      [...mcArea.children].forEach((b, i) => {
        b.disabled = true;
        if (choices[i] === h.core) b.classList.add("correct");
        else if (choices[i] === part) b.classList.add("wrong");
      });
      recordResult(h, ok);
      showMcFeedback(h, ok);
    };
    mcArea.appendChild(btn);
  });
}

function showMcFeedback(h, ok) {
  const fb = document.getElementById("feedbackBox");
  fb.className = `feedback show ${ok ? "ok" : "err"}`;
  fb.innerHTML = `
    <div>${ok ? "✅ 答對了！" : "❌ 答錯了！"} 正確答案：<b>${h.name}</b> — <b>${h.core}</b></div>
    <div class="full-desc">附件三完整描述：${h.full}</div>
    <div class="tip">💡 ${h.tip}</div>
  `;
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("nextBtn").focus();
}

function recordResult(h, ok) {
  state.answered = true;
  if (ok) {
    state.right++;
    state.wrongIds.delete(h.id);
  } else {
    state.wrong++;
    state.wrongIds.add(h.id);
  }
  saveWrong();
  updateStats();
}

function renderRefGrid() {
  const grid = document.getElementById("refGrid");
  const kw = document.getElementById("refSearch").value.trim().toLowerCase();
  grid.innerHTML = "";
  const list = state.deck.filter(h => {
    if (!kw) return true;
    return String(h.id) === kw ||
      h.name.toLowerCase().includes(kw) ||
      h.aliases.some(a => a.toLowerCase().includes(kw)) ||
      h.core.toLowerCase().includes(kw) ||
      h.full.toLowerCase().includes(kw);
  });

  list.forEach(h => {
    const card = document.createElement("div");
    card.className = "ref-card";
    const imgWrap = document.createElement("div");
    imgWrap.className = "ref-img-wrap";
    imgWrap.appendChild(createImgElement(h));

    const body = document.createElement("div");
    body.className = "ref-body";
    body.title = "遮罩模式下點擊揭曉答案";
    body.onclick = () => card.classList.toggle("unmasked");
    body.innerHTML = `
      <div class="ref-title maskable">
        <span>${h.id}. ${h.name}</span>
        ${h.trap ? '<span class="badge trap">陷阱</span>' : ''}
      </div>
      <div class="ref-core maskable">粗體部位：${h.core}</div>
      <div class="ref-full maskable">完整：${h.full}</div>
      <div class="ref-note maskable">💡 ${h.tip}</div>
    `;
    card.appendChild(imgWrap);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

// Event Listeners
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.mode = btn.dataset.mode;
    if (state.mode === "ref") {
      document.getElementById("quizView").classList.add("hidden");
      document.getElementById("statsBar").classList.add("hidden");
      document.getElementById("refView").classList.remove("hidden");
      // 切換到大圖對照表時，自動恢復 1->50 順序（仍可按隨機洗牌打亂）
      rebuildDeck(false);
    } else {
      document.getElementById("refView").classList.add("hidden");
      document.getElementById("quizView").classList.remove("hidden");
      document.getElementById("statsBar").classList.remove("hidden");
      renderQuestion();
    }
  };
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    state.filter = chip.dataset.filter;
    rebuildDeck(state.mode !== "ref");
  };
});

document.getElementById("sortBtn").onclick = () => rebuildDeck(false);
document.getElementById("shuffleBtn").onclick = () => rebuildDeck(true);
document.getElementById("submitBtn").onclick = checkFillAnswer;
document.getElementById("flipBtn").onclick = () => {
  document.getElementById("flashArea").classList.toggle("flipped");
};
document.getElementById("nextBtn").onclick = () => {
  if (state.idx >= state.deck.length) {
    rebuildDeck(state.isShuffled);
  } else {
    state.idx++;
    renderQuestion();
  }
};

document.getElementById("inName").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    document.getElementById("inPart").focus();
  }
});
document.getElementById("inPart").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    if (!state.answered) checkFillAnswer();
  }
});
document.addEventListener("keydown", e => {
  if (state.mode === "flash" && e.code === "Space" && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    document.getElementById("flashArea").classList.toggle("flipped");
  }
});

document.getElementById("refSearch").addEventListener("input", renderRefGrid);
